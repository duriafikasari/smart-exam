<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMART EXAM – Ujian Seru Penyelam Cilik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#052c46; --sea:#0b5d80; --aqua:#35d0ba; --sun:#ffd23f; --coral:#ff7a59; --ink:#10324a;
  --card:#ffffffee; --line:#cfe6ee; --ok:#1fa971; --bad:#e04b4b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#7fd8ef 0%,#2aa3c9 30%,#0b5d80 65%,#052c46 100%) fixed;
  position:relative;overflow-x:hidden;
}
h1,h2,h3,.logo{font-family:'Baloo 2','Nunito',sans-serif;margin:0}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bubbles i{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff9,#fff2);border:1px solid #fff6;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px)}}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:14px 14px 60px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 2px 14px}
.logo{font-size:28px;color:#fff;text-shadow:0 3px 0 #05466a;letter-spacing:.5px;cursor:pointer}
.logo b{color:var(--sun)}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:#ffffff33;color:#fff}
.chip.ok{background:#1fa971cc}.chip.off{background:#e04b4bcc}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 8px 0 #05466a55,0 14px 30px #0003;margin-bottom:14px}
.card h2{font-size:24px;margin-bottom:4px}
.sub{color:#4d6b7c;font-size:14px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:800;font-size:13px;margin:12px 0 5px}
input[type=text],select,textarea,input[type=number]{
  width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #35d0ba66;border-color:var(--aqua)}
textarea{min-height:110px;resize:vertical}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:var(--aqua);color:#033;box-shadow:0 4px 0 #1b9a88;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b9a88}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 #c9a000}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 #c14f30}
.btn.ghost{background:#e9f4f8;color:var(--ink);box-shadow:0 4px 0 #bcd5de}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:800;border:2px solid var(--line);background:#fff;border-radius:11px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--sun);border-color:#c9a000}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:center}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.big{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:22px;border:0;text-align:left;cursor:pointer;font:inherit;color:#fff;box-shadow:0 8px 0 #0004}
.big h3{font-size:26px}.big span{font-size:14px;opacity:.95}
.big.g{background:linear-gradient(135deg,#ff9a6b,#ff6a4a)}
.big.m{background:linear-gradient(135deg,#35d0ba,#1b9ac0)}
.kode-in{font-family:'Baloo 2';font-size:28px;letter-spacing:6px;text-align:center;text-transform:uppercase}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab.back{background:#fff;color:var(--sea)}
.tab{font:inherit;font-weight:800;border:0;border-radius:99px;padding:9px 18px;background:#ffffff40;color:#fff;cursor:pointer}
.tab.on{background:#fff;color:var(--ink)}
.item{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff;flex-wrap:wrap}
.item .kd{font-family:'Baloo 2';font-weight:800;font-size:22px;letter-spacing:3px;background:var(--sun);border-radius:12px;padding:4px 12px}
.item .t{flex:1;min-width:180px}.item .t b{display:block}.item .t small{color:#5a7686}
.q{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:#fff}
.q .qh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.q .no{background:var(--sea);color:#fff;border-radius:99px;font-weight:800;min-width:30px;height:30px;display:grid;place-items:center}
.opt{display:flex;align-items:center;gap:8px;margin:6px 0}
.opt .L{font-weight:800;width:22px}
.opt input[type=radio]{width:20px;height:20px;accent-color:#1fa971}
.opt.key input[type=text]{border-color:var(--ok);background:#effaf4}
.small{font-size:12px;color:#5a7686}
.share{text-align:center}
.share .kode{font-family:'Baloo 2';font-size:64px;font-weight:800;letter-spacing:10px;color:var(--sea);margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{background:#eef7fa}
.bar{height:10px;border-radius:99px;background:#e1eef3;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--coral)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;max-width:92vw;padding:12px 18px;border-radius:14px;color:#fff;font-weight:800;background:var(--sea);box-shadow:0 8px 24px #0005;display:none}
#toast.warn{background:var(--coral)}#toast.ok{background:var(--ok)}
#busy{position:fixed;inset:0;z-index:40;background:#052c46cc;display:none;place-items:center;text-align:center;color:#fff;padding:20px}
#busy.on{display:grid}
#busy .box{background:#0b5d80;border-radius:24px;padding:26px 30px;max-width:420px}
.swim{font-size:54px;animation:sw 1.4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-30px) rotate(-6deg)}to{transform:translateX(30px) rotate(6deg)}}
.empty{text-align:center;color:#5a7686;padding:22px}
.hint{background:#fff8dc;border:2px dashed #e6c84a;border-radius:14px;padding:10px 12px;font-size:13px;margin-top:10px}
.hs .x{display:none;position:absolute;inset:0;border-radius:inherit;background:#2a2a52d0;color:#fff;place-items:center;font-size:3cqw}
.hs.muted .x{display:grid}
body.stage-mode{background:#031a2b}

body.stage-mode .wrap{padding:0;max-width:none}
body.stage-mode header.top{display:none}
.stagebox{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#0f7aa3 0%,#073b5c 60%,#052c46 100%);z-index:2;overflow:hidden}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;container-type:inline-size;background:#06324a;overflow:hidden;flex:none}
.stagebox.full{display:block}
.stage.full{width:100%;height:100%;aspect-ratio:auto;touch-action:none}
#cv{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#cv.grabbing{cursor:grabbing}
body.stage-mode{overflow:hidden;overscroll-behavior:none}
.rot{display:none;align-items:center;gap:8px;background:#fff;color:#0b5d80;border-radius:99px;padding:6px 8px 6px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #05466a66;pointer-events:auto;max-width:94vw}
.rot button{font:inherit;border:0;background:#e5f3f8;border-radius:50%;width:26px;height:26px;cursor:pointer;color:#0b5d80;flex:none}
@media (orientation:portrait) and (max-width:700px){.rot{display:flex}}
body.rotoff .rot{display:none!important}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hs{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:3cqw;transition:transform .1s,box-shadow .15s,background .15s}
.hs:hover{background:#ffffff22;box-shadow:0 0 0 .25cqw #fffa,0 0 2cqw #fff9}
.hs:focus-visible{outline:.4cqw solid var(--sun);outline-offset:.2cqw}
.hs:active{transform:scale(.96)}
.hs.card{border-radius:5cqw}
.kembali{position:absolute;left:1.6%;top:2.6%;width:13.4%;height:8.6%;display:flex;align-items:center;justify-content:center;gap:.7cqw;
  font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:2.3cqw;color:#fff;letter-spacing:.1cqw;cursor:pointer;
  border:.3cqw solid #fff;border-radius:2.2cqw;background:linear-gradient(#4a9bff,#1747c9);
  box-shadow:0 .5cqw 0 #0e2f8a,0 1cqw 2cqw #0007;text-shadow:0 .2cqw 0 #0e2f8a}
.kembali svg{width:2.6cqw;height:2.6cqw;flex:none;display:block}
.kembali:hover{filter:brightness(1.12)}.kembali:active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 #0e2f8a}
.kembali:focus-visible{outline:.4cqw solid var(--sun);outline-offset:.2cqw}
#modal{position:fixed;inset:0;z-index:60;background:#031a2bcc;display:none;place-items:center;padding:14px}
#modal.on{display:grid}
#modal .mb{background:#fff;border-radius:22px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 0 #05466a66}
#modal h2{font-size:26px;margin-bottom:8px}#modal h3{font-size:18px;margin:12px 0 4px;color:var(--sea)}
#modal ol{margin:4px 0 0;padding-left:22px;line-height:1.5}
.avs{display:flex;gap:10px;justify-content:center;margin:10px 0}
.avs img{width:46%;border-radius:22px;border:4px solid #fff;box-shadow:0 6px 0 #05466a55}
.av1{display:block;width:min(260px,70%);margin:12px auto;border-radius:22px;border:4px solid #fff;box-shadow:0 6px 0 #05466a55}
.hudw{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;flex-direction:column;gap:6px;pointer-events:none;padding:max(8px,1.6vmin) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:auto}
.hbtn{font:inherit;font-weight:800;font-size:clamp(12px,1.7vw,18px);color:#fff;background:#e04b4bdd;border:2px solid #fff;border-radius:99px;padding:6px 14px;min-height:34px;cursor:pointer;flex:none}
.trk{flex:1 1 120px;min-width:120px;height:clamp(26px,4.2vmin,40px);position:relative;background:#06324aa8;border-radius:99px;border:2px solid #ffffffb0}
.trk .mk{position:absolute;top:50%;width:clamp(24px,3.8vmin,38px);height:clamp(24px,3.8vmin,38px);border-radius:50%;border:2px solid #fff;background-size:cover;background-position:50% 30%;transform:translate(-50%,-50%);transition:left .7s ease;left:5%}
.trk .mk.me{border-color:#ffd23f;z-index:2}.trk .mk.op{border-color:#ff7a59}
.trk .flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:clamp(14px,2.4vmin,24px)}
.pill{background:#06324acc;color:#fff;border-radius:99px;padding:4px 12px;font-family:'Baloo 2';font-size:clamp(12px,1.9vw,20px);font-weight:800;border:2px solid #ffffff90;white-space:nowrap;flex:none}
.pill.sun{border-color:#ffd23f;color:#ffd23f}
.subhud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;pointer-events:none}
.oppbar,.hint{background:#06324acc;color:#fff;border-radius:99px;padding:4px 14px;font-weight:800;font-size:clamp(11px,1.6vw,16px);border:2px solid #ffffff70;text-align:center}
.oppbar{border-color:#ff7a59}
.hint:empty{display:none}
.stage.full{--qf0:clamp(15px,min(2.5vw,5vh),36px);--of0:clamp(13px,min(2.0vw,3.9vh),28px)}
.dim{position:absolute;inset:0;z-index:2;background:rgba(3,26,43,.28);pointer-events:none}
.qp{position:absolute;right:2.5%;left:auto;width:min(70%,980px);top:calc(var(--hudb,70px) + 10px);max-height:calc(100% - var(--hudb,70px) - 22px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;z-index:4;background:#fffffff4;border-radius:22px;padding:clamp(10px,1.8vmin,20px) clamp(12px,2.2vmin,24px);flex-direction:column;gap:clamp(6px,1.3vmin,14px);box-shadow:0 6px 0 #05466a66,0 14px 30px #0006;animation:popin .3s cubic-bezier(.2,1.5,.4,1)}
.qp{--qf:calc(var(--qf0)*var(--k,1));--of:calc(var(--of0)*var(--k,1))}
.qp.s1{--k:.88}.qp.s2{--k:.78}
.qp.L{right:auto;left:2.5%}
.qh{display:flex;align-items:center;gap:10px;flex:none}
.qbadge{flex:none;width:clamp(34px,6vmin,54px);height:clamp(34px,6vmin,54px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffd23f 60%,#f0a800);border:3px solid #fff;display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:clamp(20px,3.6vmin,32px);color:#0a3d78;box-shadow:0 3px 0 #c98e00,0 6px 12px #0006}
.qno{flex:none;font-family:'Baloo 2';font-weight:800;font-size:calc(var(--of)*.95);color:#0a3d78}
.tbar{flex:1;height:clamp(8px,1.4vmin,14px);border-radius:99px;background:#d9e8ef;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#35d0ba,#ffd23f 70%,#ff7a59)}
.qt{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:var(--qf);line-height:1.25;color:#06243a;overflow-wrap:anywhere;flex:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(6px,1.2vmin,12px);flex:none}
.o{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-weight:800;font-size:var(--of);line-height:1.2;color:#06243a;background:#eef6f9;border:3px solid #9fc6d6;border-radius:16px;padding:8px 12px;min-height:44px;height:auto;cursor:pointer;transition:transform .08s,background .15s;overflow-wrap:anywhere}
.o span{min-width:0}
.o:hover{background:#fff6c9;border-color:#ffd23f}.o:active{transform:scale(.97)}
.o .L{flex:none;width:calc(var(--of)*1.7);height:calc(var(--of)*1.7);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'Baloo 2';font-size:var(--of)}
.L0{background:#ff7a59}.L1{background:#1fb8a2}.L2{background:#9a63e8}.L3{background:#2f6bff}
.o.ok{background:#c9f5dd;border-color:#1fa971}.o.no{background:#ffd9d9;border-color:#e04b4b}
.note{min-height:1.2em;font-weight:800;font-size:calc(var(--of)*.85);color:#b3261e;flex:none;overflow-wrap:anywhere}
.bm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:clamp(80px,24vmin,220px);color:#fff;text-shadow:0 6px 0 #05466a,0 0 30px #35d0ba}
.bm.fin{font-size:clamp(36px,11vmin,110px);color:#ffd23f}
.fl{position:absolute;z-index:6;font-family:'Baloo 2';font-weight:800;font-size:clamp(28px,8vmin,70px);animation:flo 1s ease-out forwards;pointer-events:none;text-shadow:0 3px 0 #05466a}
.fl.ok{color:#7dffb4}.fl.no{color:#ff8e8e}
@keyframes popin{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flo{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
@media (max-aspect-ratio:1/1){
  .trk{order:5;flex:1 0 100%}
  .stage.full{--qf0:clamp(17px,4.9vw,30px);--of0:clamp(15px,4.3vw,26px)}
  .qp,.qp.L{left:3%;right:3%;width:auto}
  .pill,.hbtn{font-size:clamp(12px,3.6vw,20px)}
  .oppbar,.hint{font-size:clamp(11px,3.2vw,16px)}
}
.pav{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:3px solid #fff;flex:none}
.stars{font-size:46px;letter-spacing:6px;color:#cfdde4}.stars .on{color:#ffc928;text-shadow:0 3px 0 #c99200}
.nilai{font-family:'Baloo 2';font-weight:800;font-size:84px;line-height:1;color:var(--sea)}
.dbn{border-radius:16px;padding:10px 14px;margin:8px 0;border:3px solid}
.dbn.win{background:#e7fff1;border-color:#1fa971}.dbn.lose{background:#fff1ec;border-color:#ff7a59}.dbn.draw{background:#fff8dc;border-color:#e6c84a}
.dbn h3{font-size:22px}
/* ---------- halaman awal (pilih peran) ---------- */
html{background:#052c46}
body:has(.rolepg) .wrap{max-width:1240px}
.rolepg{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(18px,3vw,44px);align-items:center;min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px);padding:6px 0 24px}
.rp-hero{display:flex;flex-direction:column;gap:clamp(8px,2vh,20px);align-items:center;text-align:center;min-width:0}
.rp-tag{display:inline-block;background:#ffffff26;border:2px solid #ffffff80;color:#fff;border-radius:99px;padding:5px 16px;font-weight:800;font-size:clamp(12px,1.3vw,15px);letter-spacing:1px}
.rp-txt h1{font-size:clamp(30px,4.6vw,62px);line-height:1.05;color:#fff;text-shadow:0 4px 0 #05466a,0 10px 24px #0004;margin:10px 0 8px;overflow-wrap:anywhere}
.rp-txt h1 em{font-style:normal;color:var(--sun)}
.rp-txt p{margin:0 auto;max-width:34em;color:#e8fbff;font-weight:700;font-size:clamp(15px,1.7vw,21px);text-shadow:0 2px 0 #05466a99}
.rp-chars{display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2vw,28px);width:100%;max-width:640px}
.rp-chars img{display:block;width:calc(50% - 10px);height:auto;max-height:46vh;object-fit:contain;filter:drop-shadow(0 12px 14px #05466a77);animation:rpfloat 4.2s ease-in-out infinite}
.rp-chars .c2{animation-delay:-2.1s}
@keyframes rpfloat{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-14px) rotate(1.2deg)}}
.rp-access{display:flex;flex-direction:column;gap:16px;min-width:0;width:100%;max-width:520px;justify-self:center}
.rp-card{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;padding:clamp(16px,2.2vw,26px);border-radius:26px;border:0;text-align:left;font:inherit;color:#fff;box-shadow:0 8px 0 #0004,0 16px 30px #0003;width:100%}
button.rp-card{cursor:pointer;transition:transform .12s}
button.rp-card:hover{transform:translateY(-3px)}button.rp-card:active{transform:translateY(2px)}
.rp-card.g{background:linear-gradient(135deg,#ff9a6b,#ff6a4a)}
.rp-card.m{background:linear-gradient(135deg,#35d0ba,#1b9ac0)}
.rp-card .ic{font-size:clamp(34px,4vw,48px);line-height:1;background:#ffffff30;border-radius:18px;width:1.6em;height:1.6em;display:grid;place-items:center}
.rp-card .tx{min-width:0}
.rp-card h3{font-size:clamp(22px,2.4vw,30px);letter-spacing:.5px;margin:0}
.rp-card .tx>span{display:block;font-size:clamp(14px,1.4vw,16px);font-weight:700;opacity:.97;margin-top:2px;overflow-wrap:anywhere}
.rp-card .go{font-family:'Baloo 2';font-size:44px;line-height:1;opacity:.9}
.rp-form{grid-column:1/-1;display:flex;gap:10px;margin-top:8px}
.rp-form .kode-in{flex:1 1 0;min-width:0;width:100%;height:56px;font-size:28px;border-radius:14px;border:3px solid #fff;background:#fff;color:#06324a}
.rp-form .btn{flex:none;min-height:56px;padding:0 22px;font-size:16px;letter-spacing:.5px}
@media(max-width:900px){
  .rolepg{grid-template-columns:1fr;min-height:0;gap:18px}
  .rp-access{max-width:560px}
  .rp-chars img{max-height:34vh}
}
@media(max-width:480px){
  .rp-chars{max-width:360px}
  .rp-card{grid-template-columns:auto 1fr;border-radius:22px}
  button.rp-card .go{display:none}
  .rp-form{flex-direction:column}
  .rp-form .btn{width:100%}

function snapData(s){if(!s)return null;if(typeof s.data==="function"){const ex=typeof s.exists==="function"?s.exists():s.exists;if(ex===false)return null;return s.data()||null}return s}
function snapRows(snap){
  const out=[];if(!snap)return out;
  if(Array.isArray(snap)){snap.forEach(x=>{const d=snapData(x);if(d)out.push(d)});return out}
  const docs=snap.docs||[];docs.forEach(x=>{const d=snapData(x);if(d)out.push(d)});
  if(!docs.length&&typeof snap.forEach==="function"){snap.forEach(x=>{const d=snapData(x);if(d)out.push(d)})}
  return out;
}
function emptySoal(ind){return{id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),indikator:ind||"",teks:"",opsi:["","","",""],kunci:0,pembahasan:""}}
function normSoal(x,ind){
  if(!x||typeof x.teks!=="string"||!Array.isArray(x.opsi)||x.opsi.length<4)return null;
  const k=Number.isInteger(x.kunci)?x.kunci:parseInt(x.kunci,10);
  if(!(k>=0&&k<=3))return null;
  const s=emptySoal(typeof x.indikator==="string"&&x.indikator?x.indikator:ind);
  s.teks=x.teks.trim();s.opsi=x.opsi.slice(0,4).map(o=>String(o).trim());s.kunci=k;s.pembahasan=String(x.pembahasan||"").trim();
  if(!s.teks||s.opsi.some(o=>!o))return null;return s;
}
function parseJsonLoose(text){
  try{return JSON.parse(text)}catch(e){}
  const a=text.indexOf("["),b=text.lastIndexOf("]");
  if(a>=0&&b>a){try{return JSON.parse(text.slice(a,b+1))}catch(e){}}

}

/* ---------- AI ---------- */
function promptSoal(n,avoid,onlyInd){
  const f=S.form;
  return `Kamu adalah guru SD berpengalaman yang menyusun soal asesmen sesuai Kurikulum Merdeka.
Buat ${n} soal pilihan ganda.
Mata pelajaran: ${f.mapel}
Kelas: ${f.kelas} SD
Topik/materi: ${f.topik}
Kisi-kisi/indikator dari guru:
${(onlyInd||f.kisi||"(tidak ada; susun indikator sendiri dari topik)").trim()}
Tingkat kesulitan: ${f.level}

Aturan:
- Bahasa Indonesia yang mudah dipahami murid kelas ${f.kelas}.
- Tepat 4 opsi (A-D), hanya satu jawaban benar, pengecoh masuk akal, tanpa "semua benar/salah".
- Jangan membuat soal yang membutuhkan gambar. Jangan ada soal ganda/duplikat.
- Teks soal maksimal 200 karakter, tiap opsi maksimal 60 karakter (agar muat di layar gim).
- Sebarkan posisi kunci jawaban secara acak.
- Isi "indikator" dengan indikator yang diuji. "pembahasan" 1-2 kalimat singkat.
${avoid&&avoid.length?"- Hindari soal yang mirip dengan:\n"+avoid.map(t=>"  * "+t).join("\n"):""}

Balas HANYA array JSON tanpa teks lain, format:
[{"indikator":"...","teks":"...","opsi":["...","...","...","..."],"kunci":0,"pembahasan":"..."}]
"kunci" adalah indeks 0-3 dari opsi yang benar.`;
}
async function askSoal(n,avoid,onlyInd,ind){
  const input=promptSoal(n,avoid,onlyInd);
  let val=null;
  try{val=await withTimeout(S.sample.json(input,{modelTier:"default",cache:false}),120000,"Pembuat soal terlalu lama")}
  catch(e){
    const r=await withTimeout(S.sample(input,{modelTier:"default",cache:false}),120000,"Pembuat soal terlalu lama");
    val=parseJsonLoose(r.text||"");
  }
  if(val&&!Array.isArray(val)&&Array.isArray(val.soal))val=val.soal;
  if(!Array.isArray(val))throw new Error("Hasil AI tidak terbaca. Coba lagi.");
  return val.map(x=>normSoal(x,ind)).filter(Boolean);
}
async function buatSoal(){
  const f=S.form;
  if(!f.mapel||!f.topik.trim()){toast("Pilih mata pelajaran dan ketik topik dulu ya.","warn");return}
  S.judul=`${f.mapel} Kelas ${f.kelas} – ${f.topik.trim()}`;
  if(!S.sample){S.draft=[emptySoal()];S.view="review";render();toast("Pembuat soal otomatis tidak tersedia di sini. Silakan tulis soal manual.","warn");return}
  const total=f.jumlah,got=[];let guard=0;
  try{
    while(got.length<total&&guard<6){
      guard++;
      const n=Math.min(10,total-got.length);
      busy(true,"Menyusun soal…",`Soal ${got.length+1}–${got.length+n} dari ${total}`);
      const part=await askSoal(n,got.map(s=>s.teks).slice(-30));
      got.push(...part);
    }
    if(!got.length)throw new Error("Belum ada soal yang berhasil dibuat.");
    S.draft=got.slice(0,total);S.view="review";render();
    toast(`${S.draft.length} soal siap. Periksa dulu sebelum disimpan.`,"ok");
  }catch(e){
    if(got.length){S.draft=got;S.view="review";render();toast(`Hanya ${got.length} soal berhasil dibuat. Kamu bisa menambah atau membuat ulang.`,"warn")}
    else toast(e.message||"Gagal membuat soal.","warn");
  }finally{busy(false)}
}
async function ulangSoal(i){
  if(!S.sample){toast("Pembuat soal otomatis tidak tersedia.","warn");return}
  const old=S.draft[i];
  try{
    busy(true,"Membuat ulang soal no. "+(i+1)+"…");
    const r=await askSoal(1,S.draft.map(s=>s.teks).filter(Boolean).slice(-30),old.indikator||null,old.indikator);
    if(!r.length)throw new Error("Soal baru belum berhasil. Coba lagi.");
    r[0].id=old.id;S.draft[i]=r[0];render();toast("Soal diganti.","ok");
  }catch(e){toast(e.message||"Gagal.","warn")}finally{busy(false)}
}

  if(!S.db){toast("Penyimpanan belum tersedia, paket belum bisa disimpan.","warn");return}

  if(!d.length){toast("Belum ada soal.","warn");return}

}

function vRekap(){
  const R=S.rekap,p=R.paket;
  let body;
  if(R.rows===null)body=`<div class="empty">Memuat hasil…</div>`;
  else if(!R.rows.length)body=`<div class="empty">Belum ada murid yang menyelesaikan paket ini.${R.err?`<br><small>${esc(R.err)}</small>`:""}</div>`;
  else{
    const rows=R.rows.slice().sort((a,b)=>(b.skor||0)-(a.skor||0));
    const avg=Math.round(rows.reduce((t,r)=>t+(r.skor||0),0)/rows.length);
    const wrong={},cnt={};
    rows.forEach(r=>{const j=r.jawaban||{};Object.keys(j).forEach(id=>{cnt[id]=(cnt[id]||0)+1;if(!j[id])wrong[id]=(wrong[id]||0)+1})});
    const soalRows=((p&&p.soal)||[]).map((s,i)=>({i,s,c:cnt[s.id]||0,w:wrong[s.id]||0})).filter(x=>x.c).sort((a,b)=>b.w/b.c-a.w/a.c);
    body=`<p class="sub">${rows.length} murid · rata-rata skor ${avg}</p>
    <table class="tbl"><tr><th>Nama</th><th>Kelas</th><th>Mode</th><th>Benar</th><th>Skor</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas||"")}</td><td>${esc(r.mode||"")}</td><td>${esc(r.benar)}/${esc(r.total)}</td><td><b>${esc(r.skor)}</b></td></tr>`).join("")}</table>
    ${soalRows.length?`<h3 style="margin:16px 0 6px">Soal yang paling sering salah</h3>
    <table class="tbl">${soalRows.slice(0,8).map(x=>{const pc=Math.round(100*x.w/x.c);return `<tr><td>No. ${x.i+1}</td><td>${esc(x.s.teks.slice(0,70))}</td><td style="width:120px"><div class="bar"><i style="width:${pc}%"></i></div></td><td>${pc}%</td></tr>`}).join("")}</table>`:""}`;
  }
  return vGuruHead()+`<div class="card"><h2>Rekap: ${esc(p?p.judul:R.kode)}</h2>${body}</div>`;
}

const $all=(s,r=document)=>Array.from(r.querySelectorAll(s));
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildPlay(p,seed){
  const r=rng(seed),acak=!(p.pengaturan&&p.pengaturan.acak===false);
  let list=(p.soal||[]).filter(s=>s&&Array.isArray(s.opsi)&&s.opsi.length>=4).map(s=>({id:s.id,teks:String(s.teks),indikator:s.indikator||"",pembahasan:s.pembahasan||"",opsi:s.opsi.slice(0,4).map(String),kunci:+s.kunci||0}));
  if(acak){list=shuffle(list,r).map(s=>{const idx=shuffle([0,1,2,3],r);return Object.assign({},s,{opsi:idx.map(i=>s.opsi[i]),kunci:idx.indexOf(s.kunci)})})}
  return list;
}

function svgSprite(k){if(!SPR[k]){const im=new Image();im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(diverSVG(k));SPR[k]=im}return SPR[k]}
const SPI={};
function sprite(k){k=k==="P"?"P":"L";let im=SPI[k];if(!im){im=new Image();im.onload=()=>{im.ok=true};im.src="assets/diver-"+(k==="P"?"p":"l")+".webp";SPI[k]=im}return im.ok?im:null}
function drawDiver(cx,k,x,y,tilt,alpha,fx,sq){
  k=k==="P"?"P":"L";fx=fx==null?1:fx;sq=sq||0;const im=sprite(k);
  cx.save();cx.translate(x,y);cx.rotate(tilt);cx.globalAlpha=alpha;
  if(im){const h=196,w=h*im.naturalWidth/im.naturalHeight;cx.scale((k==="P"?-1:1)*fx*(1-sq*.5),1+sq);cx.drawImage(im,-w/2,-h/2,w,h)}
  else{cx.scale(fx*(1-sq*.5),1+sq);cx.drawImage(svgSprite(k),-85,-55,170,110)}
  cx.restore();
}

function genWorld(g){

  <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="kembaliM">← Kembali</button></div></div>`;
  const me={nama:S.info.nama,k:S.info.karakter},o=D.opp,host=D.role==="host";
  const card=(p,lab)=>`<div class="item">${pav(p.k)}<div class="t"><b>${esc(p.nama||"Pemain")}</b><small>${lab}</small></div></div>`;
  return `<div class="card share"><h2>Ruang Duel</h2>
  <div class="small">Kode ruang${host?" — bagikan ke temanmu":""}</div><div class="kode">${esc(D.kode)}</div>
  <div class="grid2" style="text-align:left">${card(me,host?"Tuan rumah (kamu)":"Tamu (kamu)")}${o?card(o,o.role==="host"?"Tuan rumah":"Tamu"):`<div class="item">⏳ Menunggu lawan…</div>`}</div>
  <p class="sub" style="margin-top:10px">${host?(o?"Lawan sudah masuk. Tekan Mulai kalau siap!":"Minta temanmu memasukkan kode ruang di atas."):(o?"Menunggu tuan rumah menekan Mulai…":"Mencari tuan rumah…")}</p>
  <div class="row" style="justify-content:center"><button class="btn ghost" data-act="duelkeluar">← Kembali</button>${host?`<button class="btn sun" data-act="duelmulai" ${o?"":"disabled"}>⚔️ Mulai Duel!</button>`:""}</div></div>`;
}
const ROOM_CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function genRoom(){let k="";for(let i=0;i<4;i++)k+=ROOM_CH[Math.floor(Math.random()*ROOM_CH.length)];return k}
function pres(p){const r=S.duel.room;if(r)r.presence(p).catch(()=>{})}
function peerState(p){
  const x=p.presence||{};
  return{peer:p.peer,mine:!!p.isMe,self:!!(p.isMe&&p.sameTab),role:x.role,nama:String(x.nama||"").slice(0,30),k:x.k==="P"?"P":"L",st:String(x.st||"lobby"),
    i:Math.max(0,+x.i||0),b:Math.max(0,+x.b||0),poin:+x.poin||0,ms:x.ms==null?null:+x.ms,t:+x.t||0,go:x.go||null,seed:(+x.seed||0)>>>0};
}
async function duelJoin(role,kode){
  const D=S.duel;
  if(!S.room){toast("Duel online belum tersedia di tampilan ini.","warn");return}
  kode=kode.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(kode.length!==4){toast("Kode ruang terdiri dari 4 huruf/angka.","warn");return}
  try{
    busy(true,role==="host"?"Membuat ruang…":"Masuk ruang…");
    const name=("duel-"+S.murid.kode+"-"+kode).toLowerCase();
    const r=await withTimeout(S.room.join(name),12000,"Ruang tidak merespons");
    leaveDuel(true);
    Object.assign(D,{room:r,kode,role,t:Date.now(),seed:(Math.random()*2147483647)|0,opp:null,oppLeft:false,hadOpp:false,lastGo:null,sig:""});
    D.unsub=r.onPeers(handlePeers,()=>{});
    await r.presence({role,nama:S.info.nama.trim().slice(0,30),k:S.info.karakter,st:"lobby",t:D.t,seed:role==="host"?D.seed:0,go:null,i:0,b:0,poin:0,ms:null});
    S.view="lobby";render();handlePeers();
  }catch(e){toast("Gagal masuk ruang: "+(e.message||e),"warn")}finally{busy(false)}
}
function leaveDuel(keep){
  const D=S.duel;
  if(D.unsub){try{D.unsub()}catch(e){}D.unsub=null}
  if(D.room){D.room.leave().catch(()=>{})}
  D.room=null;D.opp=null;D.oppLeft=false;D.hadOpp=false;D.sig="";
  if(!keep){D.kode="";}
}
function handlePeers(){
  const D=S.duel;if(!D.room)return;
  const list=D.room.peers().filter(p=>p.kind==="viewer"&&p.presence&&p.presence.role).map(peerState);
  const others=list.filter(p=>!p.mine);
  let opp=null,problem="";
  if(D.role==="host"){
    if(others.some(p=>p.role==="host"&&p.t<D.t))problem="Kode ruang bentrok dengan ruang lain. Buat ruang baru ya.";
    else opp=others.filter(p=>p.role==="guest").sort((a,b)=>a.t-b.t)[0]||null;
  }else{
    if(others.some(p=>p.role==="guest"&&p.t<D.t))problem="Ruang sudah penuh (maksimal 2 pemain).";
    else opp=others.find(p=>p.role==="host")||null;
  }
  if(problem){toast(problem,"warn");leaveDuel();if(S.view==="lobby"||S.view==="play"){stopGame();S.view="lobby";render()}return}
  if(opp)D.hadOpp=true;
  D.oppLeft=!opp&&D.hadOpp;
  const sig=JSON.stringify(opp)+D.oppLeft;
  const changed=sig!==D.sig;D.sig=sig;D.opp=opp;
  if(D.role==="guest"&&opp&&opp.go&&opp.go!==D.lastGo&&S.view==="lobby"){D.lastGo=opp.go;startGame("duel",opp.seed);return}
  if(!changed)return;
  if(S.view==="play")updateOppHUD();
  else if(S.view==="lobby"||S.view==="hasil")render(true);
}
function duelMulai(){
  const D=S.duel;if(!D.room||D.role!=="host"||!D.opp)return;
  const go=Date.now();D.lastGo=go;pres({go,st:"ready",seed:D.seed,i:0,b:0,poin:0,ms:null});startGame("duel",D.seed);
}
function duelUlang(){
  const D=S.duel;
  if(D.room){D.lastGo=D.lastGo;if(D.role==="host"){D.seed=(Math.random()*2147483647)|0;pres({go:null,st:"lobby",seed:D.seed,i:0,b:0,poin:0,ms:null})}else pres({st:"lobby",i:0,b:0,poin:0,ms:null})}
  S.view="lobby";render();handlePeers();
}
function vHasil(){
  const g=G,r=g.res,star=r.nilai>=90?3:r.nilai>=70?2:r.nilai>=50?1:0,D=S.duel;
  let banner="";

      banner=`<div class="dbn ${res>0?"win":res<0?"lose":"draw"}"><h3>${res>0?"🏆 Kamu MENANG!":res<0?"💪 Lawan menang, semangat!":"🤝 Seri!"}</h3>
      <small>Kamu: ${r.benar}/${r.total} benar · ${fmtMs(r.ms)} &nbsp;|&nbsp; ${esc(o.nama||"Lawan")}: ${o.b}/${r.total} benar · ${fmtMs(op.ms)}</small></div>`;
    }else if(!o&&D.oppLeft)banner=`<div class="dbn draw"><h3>Lawan keluar dari ruang</h3><small>Kamu tetap menyelesaikan gim dengan baik!</small></div>`;
    else banner=`<div class="dbn draw"><h3>⏳ Menunggu lawan selesai…</h3><small>${o?esc(o.nama||"Lawan")+": "+o.i+"/"+r.total+" soal":""}</small></div>`;
  }
  const salah=g.salahList.map(i=>g.soal[i]);
  return `<div class="card" style="text-align:center">
  <h2>Hasil Penyelamanmu</h2>
  ${banner}
  <div class="stars">${[1,2,3].map(n=>`<span class="${n<=star?"on":""}">★</span>`).join("")}</div>
  <div class="nilai">${r.nilai}</div>
  <p class="sub">✅ ${r.benar} benar · ❌ ${r.total-r.benar} salah · ⭐ ${r.poin} poin · ⏱ ${fmtMs(r.ms)}</p>
  <p class="small">${r.saved===null?"Menyimpan hasil…":r.saved?"✔ Hasil tersimpan untuk guru.":"Hasil belum tersimpan untuk guru (butuh akses Contributor)."}</p>
  ${salah.length?`<h3 style="text-align:left;margin:12px 0 6px">Soal yang perlu dipelajari lagi</h3>${salah.map(q=>`<div class="q" style="text-align:left"><b>${esc(q.teks)}</b><div class="small" style="color:#1fa971;margin-top:4px">Jawaban benar: ${["A","B","C","D"][q.kunci]}. ${esc(q.opsi[q.kunci])}</div>${q.pembahasan?`<div class="small">${esc(q.pembahasan)}</div>`:""}</div>`).join("")}`:`<div class="hint">Semua jawabanmu benar! Hebat! 🌟</div>`}
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn sun" data-act="lagi">🔁 Main lagi</button><button class="btn ghost" data-act="gantimode">Ganti mode</button><button class="btn ghost" data-act="cover">Selesai</button></div></div>`;
}
const KEYMAP={arrowleft:"left",a:"left",arrowright:"right",d:"right",arrowup:"up",w:"up",arrowdown:"down",s:"down"};
function kbTarget(e){const t=e.target;return t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)}
document.addEventListener("keydown",e=>{
  if(!G||G.dead||S.view!=="play"||kbTarget(e)||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(G.state==="ask"&&!G.locked){const i="1234".indexOf(k);if(i>=0&&k.length===1){jawab(i)}return}
  const m=KEYMAP[k];if(m){G.keys[m]=true;e.preventDefault()}
});
document.addEventListener("keyup",e=>{if(!G)return;const m=KEYMAP[e.key.toLowerCase()];if(m)G.keys[m]=false});
window.addEventListener("blur",()=>{if(G)G.keys={}});
(function dragSwim(){
  let pid=null;
  const end=e=>{if(e&&e.pointerId!==pid)return;pid=null;if(G){G.drag=false;const c=$("#cv");if(c)c.classList.remove("grabbing")}};
  document.addEventListener("pointerdown",e=>{
    const g=G;if(!g||g.dead||e.target.id!=="cv"||!(g.state==="cd"||g.state==="swim"||g.state==="goal"))return;
    const r=e.target.getBoundingClientRect(),wx=g.cam+(e.clientX-r.left)/g.css,wy=(e.clientY-r.top)/g.css,d=g.dv;
    if(Math.hypot(wx-d.x,wy-d.y)>Math.max(150,64/g.css))return;
    pid=e.pointerId;try{e.target.setPointerCapture(pid)}catch(_){}
    g.drag=true;g.moved=true;g.grab={x:wx-d.x,y:wy-d.y};g.ptr={x:e.clientX,y:e.clientY};e.target.classList.add("grabbing");e.preventDefault()});
  document.addEventListener("pointermove",e=>{if(e.pointerId===pid&&G&&G.drag)G.ptr={x:e.clientX,y:e.clientY}});
  ["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,end));
  window.addEventListener("blur",()=>end());
})();
